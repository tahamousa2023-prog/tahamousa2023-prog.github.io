{% include base_path %}
<meta charset="utf-8">
{% include seo.html %}
<link href="{% if site.atom_feed.path %}{{ site.atom_feed.path }}{% else %}{{ base_path }}/feed.xml{% endif %}" type="application/atom+xml" rel="alternate" title="{{ site.title }} Feed">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>
  document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/g, '') + ' js ';
</script>
<!-- For all browsers -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/main.css">
<!-- Visitor Tracker -->
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script>
  (function () {
    emailjs.init({ publicKey: "seTj3BgGQeOYzRikz" });

    function getBrowser() {
      const ua = navigator.userAgent;
      if (ua.includes("Edg")) return "Microsoft Edge";
      if (ua.includes("OPR") || ua.includes("Opera")) return "Opera";
      if (ua.includes("Chrome")) return "Chrome";
      if (ua.includes("Firefox")) return "Firefox";
      if (ua.includes("Safari")) return "Safari";
      return "Unknown Browser";
    }

    function getDevice() {
      return /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)
        ? "Mobile" : "Desktop";
    }

    function getLang() {
      return navigator.language || "Unknown";
    }

    if (localStorage.getItem('owner_visit') !== 'true') {
      emailjs.send("service_teekysw", "template_j18dhzn", {
        time: new Date().toLocaleString("en-GB", { timeZone: "Europe/Berlin" }),
        country: getLang(),
        page: window.location.href,
        browser: getBrowser(),
        device: getDevice(),
      });
    }

  })();
</script>
